# ADR-9 release gate + measurements/screenshots + production artifact for the
# Phase 17B1-UI Stage 1 implementation (Direction C+, branch
# phase-17b1-ui-cplus, stacked on phase-17b1-seo-depth-internal-links).
#
# Test-only workflow. It runs the project's own gate script
# (scripts/gate-round.sh) three times in a row on the pushed branch,
# measures + screenshots the 3 Stage 1 pages (Paint, Tile Adhesive,
# Stair) at 320/390/768/1280 px with scripts/measure-ui-stage1.mjs,
# measures the same pages on the Phase 17B1 baseline (PR #16 head
# 9acf474e) with the identical script and environment so the
# before/after comparison is same-environment (QA-17B1-UI-04), then
# builds the production artifact from the same source and audits
# it. No deploy step, no secrets, no Cloudflare access, no Wrangler.
# Outputs are uploaded as run artifacts (gate logs, baseline +
# candidate measurements + screenshots, production dist/ + manifest),
# never published or deployed.
#
# Triggers: push to the Phase 17B1-UI branch, and workflow_dispatch for
# manual re-runs. A workflow that only exists on a feature branch
# cannot be triggered from the Actions tab (it lists default-branch
# workflows) and no dispatch tool is available to this agent, so the
# push trigger guarantees the gate runs on the exact pushed SHA. A
# failed run does not block uploading the branch or opening the PR
# for review.
#
# Permissions: contents: read only. The jobs check out code, install
# dependencies, run tests/builds, and upload artifacts. Nothing writes
# to the repository and nothing deploys.
#
# Third-party actions are pinned to immutable commit SHAs, resolved from
# their release tags via the GitHub API on 2026-11-23:
#   actions/checkout@v4        11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4      49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/setup-python@v5    a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact@v4 ea165f8d65b6e75b540449e92b4886f43607fa02
#
# The production artifact is built only from the reviewed source and is
# kept separate from the gate's test-origin (example.com) and preview
# builds: the gate job uploads logs only, never dist/. The production
# manifest is path-inclusive (sha256 + relative path per file), per the
# PR #7 review's note that a filename-omitting digest is weaker
# provenance.
name: ADR-9 Gate (Phase 17B1-UI Stage 1)

on:
  push:
    branches: [phase-17b1-ui-cplus]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    name: ADR-9 gate (3 clean rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies (project lockfile)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: ADR-9 gate — round 1
        run: bash scripts/gate-round.sh 1 docs/gate-logs/2026-11-26-phase-17b1-ui/round-1.log
      - name: ADR-9 gate — round 2
        run: bash scripts/gate-round.sh 2 docs/gate-logs/2026-11-26-phase-17b1-ui/round-2.log
      - name: ADR-9 gate — round 3
        run: bash scripts/gate-round.sh 3 docs/gate-logs/2026-11-26-phase-17b1-ui/round-3.log
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-logs-phase17b1-ui
          path: docs/gate-logs/2026-11-26-phase-17b1-ui/
          retention-days: 30

  measurements:
    name: Stage 1 measurements + screenshots (320/390/768/1280)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (project lockfile)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: Build (local mode, test origin)
        run: npm run build
        env:
          PUBLIC_BUILD_MODE: local
          PUBLIC_SITE_URL: https://example.com
      - name: Measure + screenshot the 3 Stage 1 pages at 4 widths
        run: |
          mkdir -p /tmp/phase17b1-ui-measure
          node scripts/measure-ui-stage1.mjs . 4321 /tmp/phase17b1-ui-measure after
          pkill -f "astro preview" || true
          ls -la /tmp/phase17b1-ui-measure/
      - name: Upload measurements + screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase17b1-ui-measurements
          path: /tmp/phase17b1-ui-measure/
          retention-days: 30

  baseline-measurements:
    # QA-17B1-UI-04: the candidate measurements alone cannot support a
    # before/after percentage — the baseline must be measured with the
    # same script, browser, fonts, viewport height/widths, device scale
    # factors, and method, in the same CI environment. This job checks
    # out the Phase 17B1 baseline (PR #16 head 9acf474e), restores the
    # measure script (which does not exist on that branch — it is a
    # self-contained script importing only node built-ins + playwright),
    # builds it in local mode with the same env, and measures the same
    # 3 pages at the same 4 widths with label "before". Runs on every
    # push so the final gate run carries both versions in one run.
    name: Baseline measurements (9acf474e, same method)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Save the measure script (it does not exist on the baseline branch)
        run: cp scripts/measure-ui-stage1.mjs /tmp/measure-ui-stage1.mjs
      - name: Check out the Phase 17B1 baseline (PR #16 head 9acf474e)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-17b1-seo-depth-internal-links
      - name: Restore the measure script into the baseline tree
        run: |
          mkdir -p scripts
          cp /tmp/measure-ui-stage1.mjs scripts/measure-ui-stage1.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (baseline lockfile)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: Build baseline (local mode, test origin)
        run: npm run build
        env:
          PUBLIC_BUILD_MODE: local
          PUBLIC_SITE_URL: https://example.com
      - name: Measure the 3 Stage 1 pages at 4 widths (baseline)
        run: |
          mkdir -p /tmp/phase17b1-ui-measure-baseline
          node scripts/measure-ui-stage1.mjs . 4321 /tmp/phase17b1-ui-measure-baseline before
          pkill -f "astro preview" || true
          ls -la /tmp/phase17b1-ui-measure-baseline/
      - name: Upload baseline measurements + screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase17b1-ui-measurements-baseline
          path: /tmp/phase17b1-ui-measure-baseline/
          retention-days: 30

  production-artifact:
    name: Production artifact (audited, not deployed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies (project lockfile)
        run: npm ci --no-audit --no-fund
      - name: Production build (origin https://homediycalc.pages.dev)
        run: npm run build
        env:
          PUBLIC_BUILD_MODE: production
          PUBLIC_SITE_URL: https://homediycalc.pages.dev
      - name: Audit production artifact
        run: python3 scripts/gate-audit.py --mode production --origin https://homediycalc.pages.dev dist/
      - name: Verify production origin, canonical, robots, no noindex
        run: |
          set -euo pipefail
          grep -q "https://homediycalc.pages.dev" dist/sitemap.xml
          grep -q "https://homediycalc.pages.dev" dist/robots.txt || echo "robots.txt does not embed the origin (expected: it lists the sitemap URL; checked separately)"
          if grep -rIl "noindex" dist/ --include="*.html" | grep -q .; then
            echo "FAIL: noindex found in production HTML" >&2
            exit 1
          fi
          echo "OK: sitemap uses the production origin; no noindex in production HTML."
      - name: Production manifest (path-inclusive SHA-256 + top digest)
        run: |
          python3 - << 'PY'
          import hashlib, pathlib
          root = pathlib.Path('dist')
          lines = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rel = p.relative_to(root).as_posix()
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          manifest = '\n'.join(lines) + '\n'
          pathlib.Path('production-manifest.sha256').write_text(manifest)
          top = hashlib.sha256(manifest.encode()).hexdigest()
          print('files:', len(lines))
          print('manifest sha256:', hashlib.sha256(manifest.encode()).hexdigest())
          print('top digest (sha256 of manifest):', top)
          PY
          cat production-manifest.sha256
      - name: Upload production artifact + manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-dist-phase17b1-ui
          path: |
            dist/
            production-manifest.sha256
          retention-days: 30
