# ADR-9 release gate + V2 screenshots for the HomeDIYCalc homepage
# prototype (PR #8, Direction A: Modern DIY, V2).
#
# Test-only workflow. It runs the project's own gate script
# (scripts/gate-round.sh) three times in a row on the pushed branch,
# and separately builds the site and screenshots the homepage at
# desktop + mobile. No deploy step, no secrets, no Cloudflare access,
# no Wrangler. Outputs are uploaded as run artifacts (gate logs +
# screenshots), never published or deployed.
#
# Triggers: push to the prototype branch, and workflow_dispatch for
# manual re-runs. A workflow that only exists on a feature branch
# cannot be triggered from the Actions tab (it lists default-branch
# workflows) and no dispatch tool is available to this agent, so the
# push trigger guarantees the gate runs on the exact pushed SHA. A
# failed run does not block uploading the branch or opening the PR
# for review.
#
# Permissions: contents: read only. The jobs check out code, install
# dependencies, run tests/builds, and upload artifacts. Nothing writes
# to the repository and nothing deploys.
#
# Third-party actions are pinned to immutable commit SHAs, resolved from
# their release tags via the GitHub API on 2026-11-23:
#   actions/checkout@v4        11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4      49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/setup-python@v5    a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact@v4 ea165f8d65b6e75b540449e92b4886f43607fa02
#
# The screenshots job is separate from the gate job because the local
# VM's filesystem intermittently refuses the writes the Astro build
# needs (EPERM on the generated-types write); the runner is a clean
# environment where the build and the screenshot run reliably.
name: ADR-9 Gate (Prototype V2)

on:
  push:
    branches: [prototype/homepage-modern-diy]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    name: ADR-9 gate (3 clean rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies (project lockfile)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: ADR-9 gate — round 1
        run: bash scripts/gate-round.sh 1 docs/gate-logs/2026-11-23-homepage-prototype-v2/round-1.log
      - name: ADR-9 gate — round 2
        run: bash scripts/gate-round.sh 2 docs/gate-logs/2026-11-23-homepage-prototype-v2/round-2.log
      - name: ADR-9 gate — round 3
        run: bash scripts/gate-round.sh 3 docs/gate-logs/2026-11-23-homepage-prototype-v2/round-3.log
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-logs-v2
          path: docs/gate-logs/2026-11-23-homepage-prototype-v2/
          retention-days: 30

  screenshots:
    name: V2 screenshots (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (project lockfile)
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: Build (local mode, test origin)
        run: npm run build
        env:
          PUBLIC_BUILD_MODE: local
          PUBLIC_SITE_URL: https://example.com
      - name: Screenshot homepage (desktop 1280x800 + mobile 390x844)
        run: |
          mkdir -p /tmp/v2-shots
          node scripts/screenshot-home.mjs . 4321 /tmp/v2-shots/v2
          pkill -f "astro preview" || true
          ls -la /tmp/v2-shots/
      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homepage-v2-screenshots
          path: /tmp/v2-shots/
          retention-days: 30
